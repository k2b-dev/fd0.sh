# fd0-server - minimal Docker Compose deployment.
#
# Download:
#
#   mkdir fd0-server && cd fd0-server
#   curl -fsSLO https://fd0.sh/files/compose.yml
#   umask 077
#   printf 'METRICS_TOKEN=%s\n' "$(openssl rand -hex 32)" > .env
#   case "$(uname -m)" in arm64|aarch64) printf 'FD0_SERVER_IMAGE=%s\n' 'ghcr.io/k2b-dev/fd0-server:latest-arm64' >> .env ;; esac
#   docker compose up -d
#
# Health check:
#
#   curl http://localhost:4048/health
#
# Put your own TLS terminator in front before pointing real clients at it.
#
# Image tags are per architecture today:
#   amd64: ghcr.io/k2b-dev/fd0-server:latest
#   arm64: ghcr.io/k2b-dev/fd0-server:latest-arm64
# Override with FD0_SERVER_IMAGE in .env. Pin a released tag for production.

services:
  fd0-server:
    # Override with FD0_SERVER_IMAGE in .env.
    image: ${FD0_SERVER_IMAGE:-ghcr.io/k2b-dev/fd0-server:latest}
    env_file:
      - .env
    restart: unless-stopped
    ports:
      # Localhost by default. Terminate TLS in a reverse proxy on this host.
      - "127.0.0.1:4048:4048"
    environment:
      # Required - guards GET /metrics. Generate with `openssl rand -hex 32`.
      FD0_METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}

      # Optional - defaults shown.
      # FD0_BIND: ":4048"
      # FD0_DB: /data/fd0.db
      # FD0_MAX_BODY: "8388608"
      # FD0_VERBOSE: "false"
      #
      # Disaster-recovery peer settings. Leave unset for a solo server.
      # FD0_LABEL: "primary"
      # FD0_PEERS: "https://api2.example.com"
      # FD0_PEER_RESOLVE_INTERVAL: "1h"
      # FD0_REPLICATE_FROM: "https://api.example.com"
      # FD0_REPLICATE_INTERVAL: "30s"
      #
      # Rate limits.
      # FD0_RATELIMIT_OFF: "false"
      # FD0_RATELIMIT_WRITES_PER_MIN: "60"
      # FD0_RATELIMIT_BYTES_PER_MIN: "33554432"
      # FD0_RATELIMIT_REGISTER_PER_HOUR: "5"
      # Trust X-Forwarded-For only from the exact reverse-proxy network.
      # FD0_TRUSTED_PROXY_CIDRS: "10.20.0.5/32"
    volumes:
      - fd0-server-data:/data

volumes:
  fd0-server-data:
