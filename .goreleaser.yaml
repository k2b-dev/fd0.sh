version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: fd0
    main: ./cmd/fd0
    binary: fd0
    env: [CGO_ENABLED=0]
    flags: [-tags=netgo]
    # .Version is `.Tag` with leading "v" stripped. With scoped tags
    # .Version comes from goreleaser parsing the v-prefixed alias tag
    # (see .github/workflows/release.yml — local v$SEMVER created from
    # the scoped trigger tag). Result: `fd0 version` always prints just
    # `0.2.0` regardless of whether the user pushed client-v0.2.0 or
    # fd0-v0.2.0.
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: fd0-agent
    main: ./cmd/fd0-agent
    binary: fd0-agent
    env: [CGO_ENABLED=0]
    flags: [-tags=netgo]
    # .Version is `.Tag` with leading "v" stripped. With scoped tags
    # .Version comes from goreleaser parsing the v-prefixed alias tag
    # (see .github/workflows/release.yml — local v$SEMVER created from
    # the scoped trigger tag). Result: `fd0 version` always prints just
    # `0.2.0` regardless of whether the user pushed client-v0.2.0 or
    # fd0-v0.2.0.
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: fd0-browser-host
    main: ./cmd/fd0-browser-host
    binary: fd0-browser-host
    env: [CGO_ENABLED=0]
    flags: [-tags=netgo]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: fd0-server
    main: ./cmd/fd0-server
    binary: fd0-server
    env: [CGO_ENABLED=0]
    flags: [-tags=netgo]
    # .Version is `.Tag` with leading "v" stripped. With scoped tags
    # .Version comes from goreleaser parsing the v-prefixed alias tag
    # (see .github/workflows/release.yml — local v$SEMVER created from
    # the scoped trigger tag). Result: `fd0 version` always prints just
    # `0.2.0` regardless of whether the user pushed client-v0.2.0 or
    # fd0-v0.2.0.
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: fd0-witness
    main: ./cmd/fd0-witness
    binary: fd0-witness
    env: [CGO_ENABLED=0]
    flags: [-tags=netgo]
    # .Version is `.Tag` with leading "v" stripped. With scoped tags
    # .Version comes from goreleaser parsing the v-prefixed alias tag
    # (see .github/workflows/release.yml — local v$SEMVER created from
    # the scoped trigger tag). Result: `fd0 version` always prints just
    # `0.2.0` regardless of whether the user pushed client-v0.2.0 or
    # fd0-v0.2.0.
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: fd0-bundle
    ids: [fd0, fd0-agent, fd0-browser-host, fd0-server, fd0-witness]
    name_template: "fd0_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - docs/PROTOCOL.md
      - docs/API.md
      - docs/STORAGE.md
      - docs/TRANSLOG.md
      - docs/THREATS.md

# Docker images are built by .github/workflows/release-docker.yml
# (multi-arch, all three services). Don't duplicate that here — it
# would race goreleaser against the dedicated workflow and would
# also need a Dockerfile path that no longer exists at the repo root.

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: k2b-dev
    name: fd0.sh
  draft: false
  prerelease: auto
  # The CI workflow aliases the scoped tag (`client-v0.2.0`) into a
  # local `v0.2.0` semver for goreleaser to parse. Use the original
  # scoped tag for the visible Release name so the GitHub Releases UI
  # surfaces the prefix the user pushed. Do not retitle CLI releases:
  # fd0 <= 0.17.1 and older install scripts find CLI releases by this
  # exact title; put headlines into the release notes instead.
  name_template: "{{ .Env.ORIGINAL_TAG }}"
