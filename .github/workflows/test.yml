name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: enforce release supply-chain policy
        run: |
          bash scripts/check-release-policy.sh
          cd desktop
          bun audit

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: test isolated organization and restricted agent access
        run: bash tests/run_isolated_integration.sh tests/integration_organization.sh

      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -5

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install browser dependencies
        working-directory: browser
        run: bun install --frozen-lockfile

      - name: install browser smoke runtime
        working-directory: browser
        run: bunx playwright install --with-deps chromium

      - name: test browser integration
        working-directory: browser
        run: |
          bun run typecheck
          bun test
          bun run test:smoke
          bun run package:store

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: test isolated client and desktop installers
        run: bash tests/run_isolated_integration.sh tests/integration_desktop_installer.sh

  desktop-e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: install desktop component test runtime
        working-directory: desktop
        run: bunx playwright install chromium

      - name: test desktop app
        working-directory: desktop
        run: |
          bun run typecheck
          bun test
          bun run test:e2e

      - name: upload desktop E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-e2e-diagnostics
          path: desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop-linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install package dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev xvfb

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: build Linux AppImage
        working-directory: desktop
        env:
          FD0_DESKTOP_VERSION: 0.0.0
          FD0_DESKTOP_FLAVOR: yubikey
          FD0_DESKTOP_PCSC_LIB: /usr/lib/x86_64-linux-gnu/libpcsclite.so.1
        run: |
          npm pkg set version=0.0.0
          bun run build
          bunx electron-builder --linux AppImage --x64 --publish never

      - name: verify Linux AppImage
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          app=dist/fd0-desktop_0.0.0_linux_x86_64.AppImage
          test -x "$app"
          assert_output_line() {
            local label=$1 expected=$2 output status stderr_file stderr_output
            shift 2
            stderr_file=$(mktemp)
            set +e
            output=$("$@" 2>"$stderr_file")
            status=$?
            set -e
            stderr_output=$(<"$stderr_file")
            rm -f "$stderr_file"
            if [[ "$status" -ne 0 ]] || ! grep -Fqx -- "$expected" <<<"$output"; then
              echo "::error::$label failed with exit $status"
              printf 'expected stdout line: %s\nactual stdout:        %s\nstderr:              %s\n' "$expected" "$output" "$stderr_output"
              exit 1
            fi
          }
          assert_output_line "terminal runtime smoke" "fd0 terminal runtime ok" xvfb-run -a "$app" --fd0-terminal-runtime-smoke
          assert_output_line "desktop CLI relay" "fd0 0.0.0 yubikey" "$app" --fd0-cli-relay version
          browser_home=$(mktemp -d)
          mkdir -p "$browser_home/bin"
          browser_host="$browser_home/bin/fd0-browser-host"
          cat >"$browser_host" <<EOF
          #!/bin/sh
          exec "$PWD/$app" --fd0-browser-host-relay "\$@"
          EOF
          chmod 755 "$browser_host"
          HOME="$browser_home" FD0_BROWSER_HOST_BIN="$browser_host" \
            "$app" --fd0-cli-relay browser enable
          for manifest in \
            "$browser_home/.config/google-chrome/NativeMessagingHosts/sh.fd0.browser.json" \
            "$browser_home/.config/chromium/NativeMessagingHosts/sh.fd0.browser.json"; do
            test "$(jq -r .path "$manifest")" = "$browser_host"
          done
          test -x "$browser_host"
          rm -rf "$browser_home"
          "$app" --appimage-extract >/dev/null
          test -x squashfs-root/resources/bin/fd0-browser-host
          rm -rf squashfs-root

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: build and smoke website
        working-directory: website
        run: |
          bun run build
          (
            cd dist
            PORT=5187 NODE_ENV=production bun server.js >"$RUNNER_TEMP/fd0-website.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            for _ in {1..40}; do
              if curl --fail --silent http://127.0.0.1:5187/ >/dev/null; then
                exit 0
              fi
              sleep 0.25
            done
            cat "$RUNNER_TEMP/fd0-website.log"
            exit 1
          )

  yubikey-compile:
    # Compile-only job that exercises the `yubikey` build tag. We don't run
    # tests (they need a real card), we just want CI to fail loudly if the
    # tagged code regresses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install pcsclite
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: build with -tags=yubikey
        run: go build -tags=yubikey ./...
